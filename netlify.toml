# Netlify configuration for rinalomako.com
#
# The site is plain static HTML — there is no build step, so Netlify simply
# publishes the repository root as-is. Keeping this file in the repo means the
# configuration is versioned rather than living only in the Netlify dashboard.

[build]
  publish = "."
  command = ""

# Long-lived caching for the generated photo derivatives. Each filename carries
# a fingerprint of the original photograph, so a different picture can never
# reuse a URL and "immutable" is a promise we can actually keep.
#
# This was not always true: the names used to be just id and width, and when the
# gallery was replaced the ids started again from 001. The same URLs then served
# different photographs, and anyone who had seen the old site kept being shown
# whichever sizes their browser had already stored -- the picture changing when
# they turned their phone, because a different width was requested.
[[headers]]
  for = "/galleries/*/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Never serve the upload folder. Netlify publishes the repository root, so
# without this the full-resolution originals waiting to be processed are
# downloadable from the live site — a few minutes of exposure per upload, and
# squarely against the rights reserved on the photographs in LICENSE.
# force = true is essential here. Netlify only applies a redirect when no real
# file matches the path, so without it the uploaded photograph is served as a
# static file and this rule never fires.
[[redirects]]
  from = "/incoming/*"
  to = "/"
  status = 404
  force = true

# The website serves no original photographs at all -- every image it displays
# is a generated .webp. So any .jpg/.tif reaching the server is a camera file
# committed by mistake, and serving it would hand out a full-resolution master
# against the rights reserved in LICENSE. Two were downloadable from the site
# root for three months before this rule existed.
[[redirects]]
  from = "/*.jpg"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.jpeg"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.tif"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/*.tiff"
  to = "/"
  status = 404
  force = true

# The old gallery URLs were live and may be linked from elsewhere. Send them to
# the pages that now hold those photographs rather than to a 404.
# The three sets the site used to be divided into are gone -- there is one
# gallery now. Their page URLs go to it; the image paths beneath them must not
# be caught, which is why these match a trailing slash and not everything.
[[redirects]]
  from = "/galleries/black-and-white/"
  to = "/gallery/"
  status = 301
  force = true

[[redirects]]
  from = "/galleries/colours-street/"
  to = "/gallery/"
  status = 301
  force = true

[[redirects]]
  from = "/galleries/portraits/"
  to = "/gallery/"
  status = 301
  force = true

[[redirects]]
  from = "/galleries/dark-places/*"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/galleries/what-doesnt-leave/*"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/galleries/split-second-ordinary/*"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/galleries/bright-places/*"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/galleries/shades-of-snow/*"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/galleries/people/*"
  to = "/gallery/"
  status = 301

# The About page was retired when the site was reworked; send anyone holding
# the old link to the homepage rather than a 404.
[[redirects]]
  from = "/about/*"
  to = "/"
  status = 301

# The contacts page was renamed to the singular.
[[redirects]]
  from = "/contacts/*"
  to = "/contact/"
  status = 301
