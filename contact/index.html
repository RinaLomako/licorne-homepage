<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Ri Lomako</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/site-v2.css" />
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">Ri Lomako</a>
    <nav>
      <a href="/gallery/">gallery</a>
      <a href="/contact/" aria-current="page">contact</a>
    </nav>
  </header>

  <main class="page">
    <h1>Contact</h1>
    <p class="lead">For prints, commissions, or anything else.</p>

    <div class="field-group">
      <div>
        <div class="label">Email</div>
        <!-- Assembled in the browser from two halves, so address harvesters
             reading the page source come away empty. -->
        <a class="email" href="#" data-user="rinalomako" data-domain="gmail.com">email me</a>
      </div>
      <div>
        <div class="label">Instagram</div>
        <a href="https://instagram.com/ri_licorne" target="_blank" rel="noopener">instagram.com/ri_licorne</a>
      </div>
      <div>
        <div class="label">Gallery</div>
        <a href="https://www.gallery-arlesworkshops.com/portfolio/yekaterina-lomako/"
           target="_blank" rel="noopener">Arles Workshops &mdash; portfolio</a>
      </div>
    </div>
  </main>

  <footer class="foot">
    <span class="muted small">&copy; Ri Lomako <span data-year></span></span>
  </footer>

  <script>
    document.querySelectorAll("[data-year]").forEach(function (el) {
      el.textContent = String(new Date().getFullYear());
    });
    document.querySelectorAll("a.email").forEach(function (el) {
      var a = el.dataset.user + "@" + el.dataset.domain;
      el.href = "mailto:" + a;
      el.textContent = a;
    });
  </script>
</body>
</html>
