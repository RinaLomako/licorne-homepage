<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ri Lomako</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="image" href="/assets/img/moon.webp" />
  <link rel="stylesheet" href="/v2/assets/v2.css" />
</head>
<body>
  <section class="enter">
    <!-- width/height are a fallback so the simulation never initialises
         against a 0x0 canvas if the script runs before the stylesheet has
         been applied. -->
    <canvas id="smoke-canvas" width="1600" height="900" aria-hidden="true"></canvas>

    <!-- The only clickable things on this page. There is deliberately no
         full-page link: it swallowed the mouse drag, and the dust is the
         point of the homepage. -->
    <nav class="enter-nav">
      <a href="/v2/gallery/">gallery</a>
      <a href="/v2/contact/">contact</a>
    </nav>

    <div class="wordmark">
      <h1>Ri Lomako</h1>
      <p>Photographer &middot; Paris</p>
    </div>

    <!-- Two wordings for one gesture; CSS shows whichever suits the input
         device. "Press space" means nothing on a phone, and "drag a finger"
         means nothing with a mouse. -->
    <p class="hint">
      <span class="hint-pointer">Click and drag through the dust &mdash; or press space</span>
      <span class="hint-touch">Drag a finger through the dust</span>
    </p>
  </section>

  <script src="/assets/js/smoke.js" defer></script>
</body>
</html>
